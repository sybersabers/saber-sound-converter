  /* ===== HUD テーマ（ダーク＋シアン発光＋オレンジのアクセント） ===== */
  :root{
    --bg:#03060b; --panel:rgba(8,19,32,.94); --panel2:#071420; --line:rgba(55,226,255,.2); --line2:rgba(55,226,255,.5);
    --text:#e6f4ff; --muted:#8fb0c4; --accent:#37e2ff; --accent2:#2a8cff; --ok:#37e2ff; --warn:#ff9a3c; --bad:#ff5a6a; --chip:rgba(55,226,255,.06);
    --c:12px;
    --disp:'PWC Display',system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    --mono:'PWC Mono',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(ellipse at 70% -10%,rgba(42,140,255,.2),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(55,226,255,.07),transparent 50%),
      linear-gradient(rgba(55,226,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(55,226,255,.045) 1px,transparent 1px);
    background-size:auto,auto,40px 40px,40px 40px;min-height:100vh}
  a{color:var(--accent)}
  .mono{font-family:var(--mono);letter-spacing:.08em}
  .disp{font-family:var(--disp);letter-spacing:.06em}

/* =====================================================================
 * 変換ロジック（画面なし・ブラウザでも Node でも動く）
 *
 * 流れ：groupFonts（フォントごとに分ける）→ detect（形式を判定）
 *       → parse（種類＋番号に分解）→ plan（変換先のファイル名を決める）
 * 種類の名前は Proffie のポリフォニック名を「中間名」として使う。
 * 名前の対応は 2026-11-22 に実物の音源（BoBF：Proffie／Xeno3／CFX-GHv3／Verso／Asteria 版）で確認。
 * ===================================================================== */
const SSC = (() => {

  /** 無視するファイル（OS が勝手に作るもの） */
  const JUNK = /(^|\/)(__MACOSX\/|\.DS_Store$|\._|Thumbs\.db$|desktop\.ini$|\.Spotlight|\.Trashes|System Volume Information\/)/i;
  const isWav = p => /\.wav$/i.test(p);
  const AUDIO_OTHER = /\.(mp3|ogg|flac|aif|aiff|m4a)$/i;
  const baseName = p => p.slice(p.lastIndexOf('/') + 1);
  const dirName = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
  const stripExt = n => n.replace(/\.[^.]+$/, '');

  /** ProffieOS の効果名（中間名）。ここにあるものは Proffie → Proffie でそのまま通す */
  const PROFFIE_TYPES = [
    'boot', 'font', 'hum', 'preon', 'out', 'fastout', 'in', 'pstoff',
    'swng', 'swingh', 'swingl', 'slsh', 'spin', 'clsh', 'stab', 'blst', 'force', 'quote',
    'lock', 'bgnlock', 'endlock', 'drag', 'bgndrag', 'enddrag', 'melt', 'bgnmelt', 'endmelt',
    'lb', 'bgnlb', 'endlb', 'ccbegin', 'ccchange', 'ccend', 'bladein', 'bladeout', 'lowbatt',
    'bgnauto', 'auto', 'endauto', 'bgnarm', 'armhum', 'endarm', 'chhum', 'chup', 'chdwn',
    'volup', 'voldown', 'volmin', 'volmax', 'mnum', 'mselect', 'mback', 'menter', 'mclick',
    'tr', 'trloop', 'monosfx', 'bmbeep', 'emtrack', 'blast'
  ];

  /* ---------- 形式ごとの定義 ----------
   * read:  変換元として読むときの「ファイル名の種類 → 中間名」（小文字）
   * write: 変換先として書くときの「中間名 → ファイル名」。無い種類は _unmapped/ へ
   * secondary: Proffie で混ざりがちな別名（中身が同じなら捨てる）
   */
  const F = {};

  F.proffie = {
    id: 'proffie', label: 'PROFFIE', full: 'Proffieboard (ProffieOS)',
    read: Object.assign(Object.fromEntries(PROFFIE_TYPES.map(t => [t, t])), {
      // モノフォニック名・他形式の名前が混ざっていても読む
      clash: 'clsh', blaster: 'blst', lockup: 'lock', swing: 'swng', slash: 'slsh',
      poweron: 'out', poweroff: 'in', pwroff: 'in', color: 'ccchange', track: 'track'
    }),
    secondary: new Set(['clash', 'blaster', 'lockup', 'swing', 'slash', 'poweron', 'poweroff', 'pwroff', 'color']),
    write: null // 中間名そのまま（plan で処理）
  };

  F.xeno3 = {
    id: 'xeno3', label: 'XENO3', full: 'Xenopixel V3',
    read: {
      hum: 'hum', in: 'in', out: 'out', font: 'font', preon: 'preon', postoff: 'pstoff',
      swing: 'swng', swingh: 'swingh', swingl: 'swingl', clash: 'clsh', blaster: 'blst', force: 'force', stab: 'stab',
      lock: 'lock', beginlock: 'bgnlock', endlock: 'endlock',
      drag: 'drag', begindrag: 'bgndrag', enddrag: 'enddrag',
      melt: 'melt', beginmelt: 'bgnmelt', endmelt: 'endmelt',
      lightningblock: 'lb', beginlightningblock: 'bgnlb', endlightningblock: 'endlb',
      // 既存ツールの綴り違い（lighting）も読めるようにする
      lightingblock: 'lb', beginlightingblock: 'bgnlb', endlightingblock: 'endlb',
      poweron: 'boot', track: 'track'
    },
    write: {
      hum: 'hum', in: 'in', out: 'out', font: 'font', preon: 'preon', pstoff: 'postoff',
      swng: 'swing', swingh: 'swingh', swingl: 'swingl', clsh: 'clash', blst: 'blaster', force: 'force', quote: 'force', stab: 'stab',
      lock: 'lock', bgnlock: 'beginlock', endlock: 'endlock',
      drag: 'drag', bgndrag: 'begindrag', enddrag: 'enddrag',
      melt: 'melt', bgnmelt: 'beginmelt', endmelt: 'endmelt',
      lb: 'lightningblock', bgnlb: 'beginlightningblock', endlb: 'endlightningblock',
      boot: 'poweron', track: 'track'
    },
    /** 実物で確認できていない対応（画面と記録に「未確認」と出す） */
    unverified: new Set(['boot', 'pstoff', 'quote', 'preon', 'stab'])
  };

  F.cfx = {
    id: 'cfx', label: 'CFX', full: 'Crystal Focus X / Golden Harvest v3',
    read: {
      boot: 'boot', font: 'font', hum: 'hum', humm: 'hum', poweron: 'out', poweronf: 'fastout', pwron: 'out',
      poweroff: 'in', pwroff: 'in', preon: 'preon', pstoff: 'pstoff',
      swing: 'swng', hswing: 'swingh', lswing: 'swingl', spin: 'spin', clash: 'clsh', stab: 'stab',
      blaster: 'blst', blast: 'blst', force: 'force', fclash: 'force',
      lockup: 'lock', lock: 'lock', startlock: 'bgnlock', bgnlock: 'bgnlock', endlock: 'endlock',
      drag: 'drag', startdrag: 'bgndrag', bgndrag: 'bgndrag', enddrag: 'enddrag',
      melt: 'melt', bgnmelt: 'bgnmelt', endmelt: 'endmelt',
      color: 'ccchange', track: 'track'
    },
    write: {
      boot: 'boot', font: 'font', hum: 'humM', out: 'poweron', fastout: 'poweronf', in: 'poweroff',
      swng: 'swing', swingh: 'hswing', swingl: 'lswing', clsh: 'clash', blst: 'blaster',
      force: 'force', quote: 'force',
      lock: 'lockup', bgnlock: 'startlock', endlock: 'endlock',
      drag: 'drag', bgndrag: 'startdrag', enddrag: 'enddrag',
      ccchange: 'color', track: 'track'
    },
    /** 番号パターン A（1つ目は番号なし、2つ目から 2,3…）。それ以外は B（1 から番号） */
    plainFirst: new Set(['blaster', 'boot', 'poweron', 'poweronf', 'font', 'force', 'lockup', 'drag', 'color', 'poweroff']),
    unverified: new Set(['fastout', 'quote', 'melt', 'bgnmelt', 'endmelt'])
  };

  /* 変換元としてだけ読む形式（BoBF の Verso／Asteria 版で確認） */
  F.verso = {
    id: 'verso', label: 'VERSO', full: 'Verso', inputOnly: true,
    read: { boot: 'boot', font: 'font', hum: 'hum', on: 'out', off: 'in', aswing: 'swng', swingh: 'swingh', swingl: 'swingl',
      clash: 'clsh', deflc: 'blst', lockup: 'lock', endlock: 'endlock', track: 'track' }
  };
  F.asteria = {
    id: 'asteria', label: 'ASTERIA', full: 'Asteria', inputOnly: true,
    read: { bankswitch: 'boot', 'hum/humm': 'hum', 'hum/hum': 'hum', 'out/poweron': 'out', 'in/poweroff': 'in', 'in/pwroff': 'in',
      'hyswing/swing': 'swng', 'clash/clash': 'clsh', 'blaster/blaster': 'blst', 'lockup/lockup': 'lock', 'drag/drag': 'drag',
      'swing/sw_h': 'swingh', 'swing/sw_l': 'swingl' }
  };

  const TARGETS = ['proffie', 'xeno3', 'cfx'];
  const FORMATS = F;

  /** Asteria の種類フォルダ（フォルダ名とファイル名が違うもの） */
  const ASTERIA_DIRS = {hyswing: /^swing\d*$/, swing: /^sw\d+_[hl]$/, in: /^(poweroff|pwroff)\d*$/, out: /^poweron\d*$/, hum: /^humm?\d*$/};
  /** 種類フォルダとして知っている名前（どれかの形式で読める名前＋tracks） */
  let KNOWN = null;
  const known = () => KNOWN || (KNOWN = new Set(['tracks', ...Object.values(F).flatMap(d => Object.keys(d.read))]));
  /** ファイル名から番号を外した「種類の部分」 */
  const typePart = p => stripExt(baseName(p)).toLowerCase().replace(/[\s_-]*\(?\d*\)?$/, '');

  /**
   * 「種類フォルダ」（clsh/、tracks/、Blaster/ など）の一覧を作る。
   * ProffieOS は font/clsh/xxx.wav の「clsh」で種類を決めるので、フォルダ名を優先する。
   * ただし font/ のように中に色々な種類が入っているフォルダは音源そのもの（種類フォルダではない）。
   */
  function effectDirs(paths){
    const parts = new Map();
    for (const p of paths) {
      const d = dirName(p); if (!d) continue;
      if (!parts.has(d)) parts.set(d, new Set());
      parts.get(d).add(typePart(p));
    }
    const out = new Set();
    for (const [d, set] of parts) {
      const dir = baseName(d).toLowerCase();
      if (dir === 'tracks') { out.add(d); continue; }
      if (ASTERIA_DIRS[dir] && [...set].every(b => ASTERIA_DIRS[dir].test(b) || ASTERIA_DIRS[dir].test(b + '1'))) { out.add(d); continue; }
      // 中のファイルが 1 種類（番号違いだけ）で、フォルダ名が知っている名前、またはファイル名と同じ
      const bases = [...set].filter(b => b !== '');
      if (bases.length <= 1 && (known().has(dir) || bases[0] === dir)) out.add(d);
    }
    return out;
  }

  /* ---------- 1. フォントごとに分ける ---------- */
  /**
   * entries: [{path:'BoBF/Xeno3/clash (1).wav', size, ...}]（パス区切りは /）
   * 音声ファイルがある一番近いフォルダを「フォント」とみなす。
   * ただしフォルダ名が効果名（clsh/、tracks/、Blaster/ など）のときは、その1つ上をフォントとする。
   */
  function groupFonts(entries, rootName = 'font'){
    const ok = entries.filter(e => !JUNK.test(e.path) && !e.path.endsWith('/'));
    const eff = effectDirs(ok.filter(e => isWav(e.path) || AUDIO_OTHER.test(e.path)).map(e => e.path));
    const fontRootOf = p => eff.has(dirName(p)) ? dirName(dirName(p)) : dirName(p);
    const roots = new Set(ok.filter(e => isWav(e.path) || AUDIO_OTHER.test(e.path)).map(e => fontRootOf(e.path)));
    // 音声のないファイル（設定ファイルなど）は、いちばん近い祖先のフォントに入れる
    const findRoot = p => { let d = dirName(p); for (;;) { if (roots.has(d)) return d; if (!d) return null; d = dirName(d); } };
    const map = new Map(), ignored = [];
    for (const e of ok) {
      const r = findRoot(e.path);
      if (r == null) { ignored.push(e); continue; }
      if (!map.has(r)) map.set(r, []);
      map.get(r).push(e);
    }
    const fonts = [...map.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([root, files]) => ({
      root, name: root ? baseName(root) : rootName,
      files: files.map(e => ({entry: e, rel: root ? e.path.slice(root.length + 1) : e.path}))
    }));
    // 同じ名前のフォントがあれば親フォルダ名を足して区別する
    const cnt = {}; fonts.forEach(f => cnt[f.name] = (cnt[f.name] || 0) + 1);
    fonts.forEach(f => { if (cnt[f.name] > 1 && f.root.includes('/')) f.name = baseName(dirName(f.root)) + '_' + f.name; });
    return {fonts, ignored};
  }

  /* ---------- 2. 形式の自動判定 ---------- */
  /** BGM（tracks）しか入っていない＝音源ではなく、SD カード直下の共通 BGM フォルダ */
  const isTracksOnly = font => { const w = font.files.filter(x => isWav(x.rel)); return w.length > 0 && w.every(x => /^tracks?\//i.test(x.rel)); };

  function detect(font){
    const s = {proffie: 0, xeno3: 0, cfx: 0, verso: 0, asteria: 0};
    let wavs = 0;
    for (const {rel} of font.files) {
      const lo = rel.toLowerCase(), n = baseName(lo), b = stripExt(n);
      if (n === 'config.ini' || n === 'smoothsw.ini') s.proffie += 20;
      if (n === 'font_config.txt' || n === 'leds.txt') s.cfx += 20;
      if (n === 'fontconfig.ini') s.xeno3 += 20;
      if (!isWav(n)) continue;
      wavs++;
      if (/ \(\d+\)$/.test(b)) s.xeno3 += 3;
      if (/^(clsh|swng|blst|bgnlock|bgndrag|bgnmelt|bgnlb|endlb|ccbegin|ccchange|ccend|pstoff|slsh)\d*$/.test(b)) s.proffie += 3;
      if (/^(clsh|swng|blst|in|out|swingh|swingl|boot|lock|drag|melt|force|quote)\//.test(lo)) s.proffie += 3;
      if (/^(humm\d*|pwroff2|hswing\d*|lswing\d*|startlock\d*|startdrag\d*|poweron\d*|poweroff\d*|poweronf\d*|color)$/.test(b)) s.cfx += 3;
      if (/^(aswing|deflc|on|off)\d+$/.test(b)) s.verso += 4;
      if (/^(hyswing|swing|blaster|clash|hum)\//.test(lo) && /^(hyswing|swing|blaster|clash|hum|in|out|lockup|drag)\//.test(lo)) s.asteria += 2;
      if (/^swing\/sw\d+_[hl]$/.test(lo.replace(/\.wav$/, '')) || b === 'bankswitch') s.asteria += 6;
    }
    const order = Object.entries(s).sort((a, b) => b[1] - a[1]);
    const format = order[0][1] > 0 ? order[0][0] : 'proffie';
    return {format, scores: s, wavs, sure: order[0][1] > 0 && order[0][1] >= 2 * (order[1][1] || 0)};
  }

  /* ---------- 3. 種類＋番号に分解 ---------- */
  /** 1つのファイル → {name（種類名・小文字）, num（番号。なければ 0）} */
  function splitName(rel, fmt){
    const lo = rel.toLowerCase(), parts = lo.split('/'), file = stripExt(parts[parts.length - 1]);
    const dir = parts.length > 1 ? parts[parts.length - 2] : '';
    if (fmt === 'asteria') {
      let m = /^sw(\d+)_([hl])$/.exec(file);
      if (dir === 'swing' && m) return {name: 'swing/sw_' + m[2], num: +m[1]};
      m = /^(.*?)(\d*)$/.exec(file);
      return {name: (dir ? dir + '/' : '') + m[1], num: m[2] ? +m[2] : 0};
    }
    let m = /^(.*?)\s*\((\d+)\)$/.exec(file);           // Xeno3：clash (1)
    if (!m) m = /^(.*?)[\s_-]*(\d*)$/.exec(file);         // clash1 / clsh01 / clash_01 / 001
    let name = m[1], num = m[2] ? +m[2] : 0;
    if (!name && dir) name = dir;                          // clsh/001.wav
    if (dir === 'tracks' || dir === 'track') return {name: 'track', num, keep: baseName(rel)};
    // 種類フォルダの中（clsh/xxx.wav）はフォルダ名を優先（ProffieOS と同じ）。ファイル名と違えば記録
    if (dir && parts.length === 2 && F[fmt].read[dir] && name !== dir) return {name: dir, num, misnamed: name};
    if (fmt === 'cfx' && name === 'pwroff' && num === 2) return {name: 'pwroff2', num: 0};
    return {name, num};
  }

  /**
   * フォントを種類ごとに分ける。
   * 戻り値：{types: Map(中間名 → [{f, name, num}...]（番号順）), unknown: [f...], configs: [f...]}
   */
  function parse(font, fmt){
    const def = F[fmt], types = new Map(), unknown = [], configs = [];
    for (const f of font.files) {
      const n = baseName(f.rel);
      if (!isWav(n)) {
        if (AUDIO_OTHER.test(n)) unknown.push({f, why: 'notWav'});
        else configs.push(f);
        continue;
      }
      const sp = splitName(f.rel, fmt);
      let key = sp.name;
      if (key === 'pwroff2') key = 'pwroff';
      const type = def.read[key];
      if (!type) { unknown.push({f, why: 'unknownName'}); continue; }
      if (!types.has(type)) types.set(type, []);
      types.get(type).push({f, name: sp.name, num: sp.num, keep: sp.keep, misnamed: sp.misnamed});

      if (fmt === 'cfx' && x.name === 'pwroff2') return 1.5;
      if (fmt === 'cfx' && x.name === 'poweroff' && x.num >= 2) return x.num;
      return x.num;
    };
    for (const list of types.values()) list.sort((a, b) => (rank(a) - rank(b)) || a.f.rel.localeCompare(b.f.rel, 'en', {numeric: true}));
    return {types, unknown, configs};

    'Version=2', 'SwingSensitivity=450.0', 'MaximumHumDucking=75.0', 'SwingSharpness=1.75',
    'SwingStrengthThreshold=20.0', 'Transition1Degrees=45.0', 'Transition2Degrees=160.0', 'MaxSwingVolume=3.0', ''

  /**
   * font を target 形式にしたときの出力一覧を作る。
   * 戻り値：{items:[{out, src, type, note}], unmapped:[{out, src, why}], extra:[{out, text}], warnings:[{key, args}]}
   *   src は font.files の要素（中身はまだ読まない）
   */
  function plan(font, srcFmt, target, opts = {}){
    opts = Object.assign({}, DEFAULT_OPTS, opts);
    const P = parse(font, srcFmt), tdef = F[target];
    const dropped = [];
    if (opts.exclude && opts.exclude.size) for (const [t, list] of P.types) {
      const keep = list.filter(x => !opts.exclude.has(x.f));
      dropped.push(...list.filter(x => opts.exclude.has(x.f)).map(x => x.f));
      if (keep.length) P.types.set(t, keep); else P.types.delete(t);
    }
    const items = [], unmapped = [], extra = [], warnings = [];
    const types = new Map([...P.types].map(([k, v]) => [k, v.slice()]));

    // Proffie 入力：同じ効果に別名が混ざっていたら記録（中身の比較は dedupe() で後から）
    const mixed = [];
    if (srcFmt === 'proffie') for (const [t, list] of types) {
      const names = new Set(list.map(x => x.name));
      if (names.size > 1 && list.some(x => F.proffie.secondary.has(x.name))) mixed.push(t);
    }

    // quote は Xeno3／CFX では force に入れる（区別がない）

      const q = types.get('quote'); types.delete('quote');
      types.set('force', (types.get('force') || []).concat(q));
      warnings.push({key: 'wQuote', args: {n: q.length}});

    if (target === 'cfx') {
      if (opts.meltToDrag) for (const [m, d] of [['melt', 'drag'], ['bgnmelt', 'bgndrag'], ['endmelt', 'enddrag']]) {
        if (!types.has(m)) continue;
        types.set(d, (types.get(d) || []).concat(types.get(m))); types.delete(m);
        warnings.push({key: 'wMeltDrag', args: {}});

      const fl = types.get('font');
      if (fl && fl.length > 1) { types.set('font', fl.slice(0, 1)); types.set('boot', (types.get('boot') || []).concat(fl.slice(1))); warnings.push({key: 'wCfxFont', args: {n: fl.length - 1}}); }
    }

    const order = [...PROFFIE_TYPES, 'track'];
    const sortedTypes = [...types.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b));
    for (const type of sortedTypes) {
      const list = types.get(type);

    }
    for (const u of P.unknown) unmapped.push({out: '_unmapped/' + u.f.rel, src: u.f, why: u.why});
    for (const c of P.configs) {
      const n = baseName(c.rel).toLowerCase();
      const keep = (target === 'proffie' && /^(config\.ini|smoothsw\.ini)$/.test(n) && srcFmt === 'proffie')
        || (target === 'cfx' && /^(font_config\.txt|leds\.txt)$/.test(n) && srcFmt === 'cfx')
        || (target === 'xeno3' && n === 'fontconfig.ini' && srcFmt === 'xeno3');
      if (keep) items.push({out: baseName(c.rel), src: c, type: 'config', note: ''});
      else unmapped.push({out: '_unmapped/' + c.rel, src: c, why: 'config'});
    }
    // Proffie：SmoothSwing のペアがあって smoothsw.ini がなければ足す
    if (target === 'proffie' && opts.addIni) {
      const has = n => items.some(i => i.out.toLowerCase() === n);
      if (!has('smoothsw.ini') && types.has('swingh') && types.has('swingl')) extra.push({out: 'smoothsw.ini', text: PROFFIE_SMOOTHSW});
    }
    if (target === 'proffie' && !(types.has('swingh') && types.has('swingl')) && types.has('swng')) warnings.push({key: 'wNoSmooth', args: {}});
    if (!types.has('hum')) warnings.push({key: 'wNoHum', args: {}});
    for (const t of mixed) warnings.push({key: 'wMixed', args: {t}});
    const mis = [...P.types.values()].flat().filter(x => x.misnamed && x.misnamed !== '').map(x => x.f.rel);
    if (mis.length) warnings.push({key: 'wDirName', args: {n: mis.length, f: mis.join(', ')}});
    if (dropped.length) warnings.push({key: 'wDupDropped', args: {n: dropped.length, f: dropped.map(f => f.rel).join(', ')}});
    if (unmapped.length) warnings.push({key: 'wUnmapped', args: {n: unmapped.length}});
    const unv = [...new Set(items.filter(i => i.note === 'unverified').map(i => i.type))];
    if (unv.length) warnings.push({key: 'wUnverified', args: {t: unv.join(', ')}});
    return {items, unmapped, extra, warnings, mixed, dropped, parsed: P};
  }

  /** 変換先のパス */
  function outPath(target, type, name, i, count, x, opts){
    const n = i + 1;
    if (target === 'proffie') {
      if (type === 'track') return 'tracks/' + (x.keep && x.keep.toLowerCase() !== 'track.wav' && !/^track\s*\(?\d*\)?\.wav$/i.test(x.keep) ? x.keep : `track${String(n).padStart(Math.max(opts.digits, String(count).length), '0')}.wav`);
      if (count === 1) return name + '.wav';
      const num = String(n).padStart(Math.max(opts.digits, String(count).length), '0');
      return `${name}/${name}${num}.wav`;
    }
    if (target === 'xeno3') return `${name} (${n}).wav`;

    if (type === 'track') return `tracks/track${n}.wav`;
    if (type === 'in') {
      // 消灯：1つ目 poweroff、2つ目 pwroff2（動かしながら消灯）、3つ目から poweroff2, poweroff3…（BoBF の CFX 版と同じ並び）
      if (n === 1) return 'poweroff.wav';
      if (n === 2) return 'pwroff2.wav';
      return `poweroff${n - 1}.wav`;
    }
    if (F.cfx.plainFirst.has(name)) return n === 1 ? name + '.wav' : `${name}${n}.wav`;
    return `${name}${n}.wav`;
  }

  /** 出力パスの重複（大文字小文字違いも）があれば後ろに _2 を付ける */
  function uniquePaths(list){
    const seen = new Set();
    for (const it of list) {
      let p = it.out, k = p.toLowerCase(), i = 2;
      while (seen.has(k)) { p = it.out.replace(/(\.[^.\/]+)?$/, m => `_${i}${m}`); k = p.toLowerCase(); i++; }
      it.out = p; seen.add(k);
    }
    return list;
  }

  /**
   * Proffie 入力で別名が混ざった種類（ccchange.wav と color/color.wav など）について、
   * 別名側のファイルが本来の名前のファイルと中身まで同じなら、そのファイルの一覧を返す。
   * plan(..., {exclude}) に渡すと出力から外して番号を詰める。readData(f) → Uint8Array
   */
  async function findMixedDupes(pl, readData){
    const drop = new Set();
    const same = (a, b) => { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; };
    for (const t of pl.mixed || []) {
      const list = pl.parsed.types.get(t) || [];
      const prim = list.filter(x => !F.proffie.secondary.has(x.name)), sec = list.filter(x => F.proffie.secondary.has(x.name));
      const pd = []; for (const x of prim) pd.push(await readData(x.f));
      for (const x of sec) { const d = await readData(x.f); if (pd.some(p => same(p, d))) drop.add(x.f); }
    }
    return drop;
  }

  /** 対象外の形式（Verso／Asteria）や判定結果の表示用 */
  const label = id => (F[id] || {}).label || id;

  return {isTracksOnly, FORMATS, TARGETS, PROFFIE_TYPES, groupFonts, detect, parse, plan, findMixedDupes, uniquePaths, splitName, label, DEFAULT_OPTS, isWav};
})();

/* =====================================================================
 * ZIP の読み書き（外部ライブラリなし）
 *  読み込み：無圧縮（store）と Deflate。展開はブラウザ標準の DecompressionStream('deflate-raw')
 *            中身は必要になるまで読まない（数百 MB の ZIP でも固まらないように）
 *  書き出し：無圧縮（store）。WAV はほとんど縮まないので速さ優先
 * ===================================================================== */
const Zip = (() => {
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8, crc = 0){ crc = ~crc >>> 0; for (let i = 0; i < u8.length; i++) crc = CRC_T[(crc ^ u8[i]) & 255] ^ (crc >>> 8); return ~crc >>> 0; }

  const u8of = async blob => new Uint8Array(await blob.arrayBuffer());
  const dv = u8 => new DataView(u8.buffer, u8.byteOffset, u8.byteLength);

  /** ファイル名の文字コード：UTF-8 の印があれば UTF-8、なければ UTF-8 として読めるか試して、だめなら Shift_JIS（日本の Windows） */
  function decodeName(bytes, utf8Flag){
    if (utf8Flag) return new TextDecoder('utf-8').decode(bytes);
    if (bytes.every(b => b < 0x80)) return String.fromCharCode(...bytes);
    try { return new TextDecoder('utf-8', {fatal: true}).decode(bytes); } catch {}
    try { return new TextDecoder('shift_jis').decode(bytes); } catch {}
    return new TextDecoder('latin1').decode(bytes);
  }

  /** Deflate を展開。limit を渡すと先頭 limit バイトだけ読んで止める */
  async function inflate(blob, limit = Infinity){
    const rd = blob.stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const parts = []; let n = 0;
    try {
      for (;;) {
        const {done, value} = await rd.read();
        if (done) break;
        parts.push(value); n += value.length;
        if (n >= limit) { rd.cancel().catch(() => {}); break; }
      }
    } catch (e) { if (n < limit && limit !== Infinity) {} else if (limit === Infinity) throw e; }
    const out = new Uint8Array(Math.min(n, limit)); let o = 0;
    for (const p of parts) { const take = Math.min(p.length, out.length - o); out.set(p.subarray(0, take), o); o += take; if (o >= out.length) break; }
    return out;
  }

  /**
   * ZIP（File/Blob）の目次を読む。戻り値：[{path, size, read(), head(n)}]
   */
  async function open(file){
    const tailLen = Math.min(file.size, 65557);
    const tail = await u8of(file.slice(file.size - tailLen));
    let e = -1;
    for (let i = tail.length - 22; i >= 0; i--) if (tail[i] === 0x50 && tail[i + 1] === 0x4b && tail[i + 2] === 5 && tail[i + 3] === 6) { e = i; break; }
    if (e < 0) throw new Error('ZIP_BAD');
    const t = dv(tail);
    let count = t.getUint16(e + 10, true), cdSize = t.getUint32(e + 12, true), cdOff = t.getUint32(e + 16, true);
    if (cdOff === 0xFFFFFFFF || count === 0xFFFF) {           // ZIP64
      const loc = e - 20;
      if (loc >= 0 && t.getUint32(loc, true) === 0x07064b50) {
        const off = Number(t.getBigUint64(loc + 8, true));
        const r = dv(await u8of(file.slice(off, off + 56)));
        count = Number(r.getBigUint64(32, true)); cdSize = Number(r.getBigUint64(40, true)); cdOff = Number(r.getBigUint64(48, true));
      }

    const cd = await u8of(file.slice(cdOff, cdOff + cdSize)), c = dv(cd);
    const list = [];
    for (let p = 0, i = 0; i < count && p + 46 <= cd.length; i++) {
      if (c.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP_BAD');
      const flag = c.getUint16(p + 8, true), method = c.getUint16(p + 10, true);
      let csize = c.getUint32(p + 20, true), usize = c.getUint32(p + 24, true);
      const nl = c.getUint16(p + 28, true), xl = c.getUint16(p + 30, true), cl = c.getUint16(p + 32, true);
      let lho = c.getUint32(p + 42, true);
      const name = decodeName(cd.subarray(p + 46, p + 46 + nl), flag & 0x800).replace(/\\/g, '/');
      // ZIP64 の大きさ・位置
      for (let x = p + 46 + nl; x < p + 46 + nl + xl - 4;) {
        const id = c.getUint16(x, true), sz = c.getUint16(x + 2, true);
        if (id === 1) { let q = x + 4;
          if (usize === 0xFFFFFFFF) { usize = Number(c.getBigUint64(q, true)); q += 8; }
          if (csize === 0xFFFFFFFF) { csize = Number(c.getBigUint64(q, true)); q += 8; }
          if (lho === 0xFFFFFFFF) { lho = Number(c.getBigUint64(q, true)); } }
        x += 4 + sz;
      }
      p += 46 + nl + xl + cl;
      if (name.endsWith('/')) continue;
      const ent = {path: name, size: usize, method, encrypted: !!(flag & 1)};
      let dataStart = null;
      const start = async () => {
        if (dataStart == null) { const h = dv(await u8of(file.slice(lho, lho + 30))); dataStart = lho + 30 + h.getUint16(26, true) + h.getUint16(28, true); }
        return dataStart;
      };
      ent.read = async () => {
        if (ent.encrypted) throw new Error('ZIP_ENC');
        const s = await start(), blob = file.slice(s, s + csize);
        if (method === 0) return u8of(blob);
        if (method === 8) return inflate(blob);
        throw new Error('ZIP_METHOD');
      };
      ent.head = async n => {
        if (ent.encrypted) return new Uint8Array(0);
        const s = await start();
        if (method === 0) return u8of(file.slice(s, s + Math.min(n, csize)));
        if (method === 8) return inflate(file.slice(s, s + csize), n);
        return new Uint8Array(0);
      };
      list.push(ent);
    }
    return list;
  }

  /** 無圧縮の ZIP を作る。add(path, Uint8Array) を順に呼んで、最後に finish() で Blob */
  function writer(){
    const parts = [], central = []; let off = 0, count = 0;
    const now = new Date();
    const dosT = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosD = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const enc = new TextEncoder();
    return {
      add(path, data){
        const name = enc.encode(path), crc = crc32(data), size = data.length;
        if (off + size > 0xFFFFFFF0) throw new Error('ZIP_TOO_BIG');
        const h = new Uint8Array(30 + name.length), d = dv(h);
        d.setUint32(0, 0x04034b50, true); d.setUint16(4, 20, true); d.setUint16(6, 0x800, true); d.setUint16(8, 0, true);
        d.setUint16(10, dosT, true); d.setUint16(12, dosD, true); d.setUint32(14, crc, true); d.setUint32(18, size, true); d.setUint32(22, size, true);
        d.setUint16(26, name.length, true); h.set(name, 30);
        const ch = new Uint8Array(46 + name.length), e = dv(ch);
        e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x800, true); e.setUint16(10, 0, true);
        e.setUint16(12, dosT, true); e.setUint16(14, dosD, true); e.setUint32(16, crc, true); e.setUint32(20, size, true); e.setUint32(24, size, true);
        e.setUint16(28, name.length, true); e.setUint32(42, off, true); ch.set(name, 46);
        parts.push(new Blob([h, data])); central.push(ch);
        off += h.length + size; count++;
      },
      finish(){
        if (count > 0xFFFF) throw new Error('ZIP_TOO_BIG');
        const cdSize = central.reduce((a, b) => a + b.length, 0);
        const end = new Uint8Array(22), d = dv(end);
        d.setUint32(0, 0x06054b50, true); d.setUint16(8, count, true); d.setUint16(10, count, true); d.setUint32(12, cdSize, true); d.setUint32(16, off, true);
        return new Blob([...parts, ...central, end], {type: 'application/zip'});
      },
      get size(){ return off; }
    };
  }

  return {open, writer, crc32};
})();

/* ---------- WAV の形式チェック（先頭だけ読む） ---------- */
const Wav = {
  /** 先頭のバイト列から {rate, ch, bits, tag} を読む。読めなければ null */
  info(u8){
    if (u8.length < 12) return null;
    const d = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const s4 = i => String.fromCharCode(u8[i], u8[i + 1], u8[i + 2], u8[i + 3]);
    if (s4(0) !== 'RIFF' || s4(8) !== 'WAVE') return null;
    for (let i = 12; i + 8 <= u8.length;) {
      const id = s4(i), sz = d.getUint32(i + 4, true);
      if (id === 'fmt ' && i + 24 <= u8.length) {
        let tag = d.getUint16(i + 8, true);
        const bits = d.getUint16(i + 22, true);
        if (tag === 0xFFFE && i + 34 <= u8.length) tag = d.getUint16(i + 32, true); // WAVE_FORMAT_EXTENSIBLE
        return {tag, ch: d.getUint16(i + 10, true), rate: d.getUint32(i + 12, true), bits};
      }
      i += 8 + sz + (sz & 1);
    }
    return null;
  },
  /** ProffieOS などで推奨の 44.1kHz／16bit／モノラル PCM か */
  isStd: f => f && f.tag === 1 && f.rate === 44100 && f.bits === 16 && f.ch === 1,
  fmt: f => f ? `${f.rate / 1000}kHz/${f.bits}bit/${f.ch === 1 ? 'mono' : f.ch === 2 ? 'stereo' : f.ch + 'ch'}${f.tag === 1 ? '' : '/fmt' + f.tag}` : '?'

/* ---------- 入力：フォルダ・ZIP・ドラッグ＆ドロップを同じ形 {path, size, read(), head(n)} にそろえる ---------- */
const Input = {
  /** File（フォルダ選択なら webkitRelativePath つき）→ 入力 1 件 */
  fromFile(file, path){
    return {path: path || file.webkitRelativePath || file.name, size: file.size,
      read: async () => new Uint8Array(await file.arrayBuffer()),
      head: async n => new Uint8Array(await file.slice(0, n).arrayBuffer())};
  },
  /** ZIP の中身。ZIP の直下に音源が直接入っていたら、ZIP の名前をフォルダ名にする */
  async fromZip(file, prefix = ''){
    if (typeof DecompressionStream === 'undefined') throw new Error('NO_DS');
    const list = await Zip.open(file);
    if (list.some(e => e.encrypted)) throw new Error('ZIP_ENC');
    const flat = list.some(e => !e.path.includes('/') && SSC.isWav(e.path));
    const base = file.name.replace(/\.zip$/i, '');
    return list.map(e => Object.assign(e, {path: prefix + (flat ? base + '/' : '') + e.path}));
  },
  /** ドラッグ＆ドロップ（フォルダごと落とされたら中をたどる） */
  async fromDrop(dt){
    const out = [], jobs = [];
    const items = [...(dt.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!items.length) { for (const f of dt.files || []) jobs.push(this.addFile(out, f, f.name)); await Promise.all(jobs); return out; }
    const walk = async (ent, pre) => {
      if (ent.isFile) { const f = await new Promise((res, rej) => ent.file(res, rej)); await this.addFile(out, f, pre + f.name); return; }
      const rd = ent.createReader();
      for (;;) {
        const batch = await new Promise((res, rej) => rd.readEntries(res, rej));
        if (!batch.length) break;
        for (const c of batch) await walk(c, pre + ent.name + '/');
      }
    };
    for (const ent of items) await walk(ent, '');
    return out;
  },
  async addFile(out, f, path){
    if (/\.zip$/i.test(f.name)) out.push(...await this.fromZip(f, path.slice(0, path.length - f.name.length)));
    else out.push(this.fromFile(f, path));
  }
};

/* =====================================================================
 * 画面
 *  01 SOURCE：音源を入れる → 02 TARGET：変換先 → 03 PREVIEW：変換前 → 変換後 → 04 CONVERT：ZIP
 * ===================================================================== */
const App = {
  entries: [], fonts: [], ignored: 0, busy: false, last: null,
  target: 'proffie', opts: {},

  init(){
    lang = store.get('lang', (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en');
    this.target = store.get('target', 'proffie');
    this.opts = Object.assign({}, SSC.DEFAULT_OPTS, store.get('opts', {}));
    $('langSel').value = lang;
    $('langSel').onchange = e => { lang = e.target.value; store.set('lang', lang); this.renderAll(); };
    $('dlgOk').onclick = () => $('dlg').close();
    $('btnConvert').onclick = () => this.convert();
    $('mailLink').onclick = e => { e.preventDefault(); this.openMail(); };
    document.addEventListener('click', async e => {
      const b = e.target.closest('.shr-link'); if (!b) return;
      try { await navigator.clipboard.writeText(b.dataset.copy); toast(t('shareCopied')); } catch { toast(t('error')); }
    });
    // ファイルの入力
    $('inFolder').onchange = e => { this.addInput([...e.target.files].map(f => Input.fromFile(f))); e.target.value = ''; };
    $('inZip').onchange = async e => { const fs = [...e.target.files]; e.target.value = ''; this.addInput(async () => { const out = []; for (const f of fs) await Input.addFile(out, f, f.name); return out; }); };
    // ページのどこに落としても受け付ける
    let depth = 0;
    window.addEventListener('dragenter', e => { if (this.busy || !e.dataTransfer.types.includes('Files')) return; depth++; document.body.classList.add('dragging'); });
    window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); } });
    window.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
    window.addEventListener('drop', e => {
      e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
      if (this.busy) return;
      const dt = e.dataTransfer; const p = Input.fromDrop(dt);
      this.addInput(() => p);
    });
    window.addEventListener('beforeunload', e => { if (this.busy) { e.preventDefault(); e.returnValue = t('leaveWarn'); } });
    this.renderAll();
  },

  /** 入力を足す（配列、または配列を返す関数） */
  async addInput(src){
    this.setStatus(t('loading'));
    try {
      const list = typeof src === 'function' ? await src() : src;
      if (!list.length) { this.setStatus(''); return; }
      // 同じパスは後から入れたほうで置き換える
      const map = new Map(this.entries.map(e => [e.path, e]));
      for (const e of list) map.set(e.path.replace(/\\/g, '/'), Object.assign(e, {path: e.path.replace(/\\/g, '/')}));
      this.entries = [...map.values()];
      this.regroup();
    } catch (err) {
      console.error(err);
      const m = String(err && err.message);
      showDialog(t('error'), m === 'ZIP_ENC' ? t('errEnc') : m === 'NO_DS' ? t('errBrowser') : /ZIP/.test(m) ? t('errZip') : m);
    }
    this.setStatus('');
  },

  regroup(){
    const old = new Map(this.fonts.map(f => [f.root, f]));
    const {fonts, ignored} = SSC.groupFonts(this.entries);
    this.ignored = ignored.length;
    this.fonts = fonts.map(f => {
      const o = old.get(f.root);
      const det = SSC.detect(f);
      return Object.assign(f, {det, fmt: o ? o.fmt : det.format, include: o ? o.include : det.format !== this.target && !SSC.isTracksOnly(f), tracksOnly: SSC.isTracksOnly(f), exclude: new Map(), wavBad: o ? o.wavBad : null, open: o ? o.open : false});
    });
    this.renderAll();
    this.scanFonts();
  },

  /** WAV の形式チェックと、Proffie の別名の重複チェック（どちらも中身を読むので後から） */
  async scanFonts(){
    const job = this.scanJob = {};
    for (const f of this.fonts) {
      if (f.wavBad) continue;
      const wavs = f.files.filter(x => SSC.isWav(x.rel)), bad = [];
      let i = 0;
      const worker = async () => {
        while (i < wavs.length) {
          const x = wavs[i++];
          try { const info = Wav.info(await x.entry.head(65536)); if (!Wav.isStd(info)) bad.push({rel: x.rel, fmt: Wav.fmt(info)}); } catch { bad.push({rel: x.rel, fmt: '?'}); }
        }
      };
      await Promise.all([1, 2, 3, 4, 5, 6].map(worker));
      if (job !== this.scanJob) return;
      f.wavBad = bad;
      this.renderPreview(); this.renderBar();
    }
    await this.checkDupes();
  },
  async checkDupes(){
    let changed = false;
    for (const f of this.fonts) {
      if (f.fmt !== 'proffie' || f.exclude.has('proffie')) continue;
      const pl = SSC.plan(f, 'proffie', this.target, this.opts);
      f.exclude.set('proffie', pl.mixed.length ? await SSC.findMixedDupes(pl, x => x.entry.read()) : new Set());
      if (f.exclude.get('proffie').size) changed = true;
    }
    if (changed) { this.renderPreview(); this.renderBar(); }
  },

  planFor(f){
    const pl = SSC.plan(f, f.fmt, this.target, Object.assign({}, this.opts, {exclude: f.exclude.get(f.fmt)}));
    SSC.uniquePaths(pl.items.concat(pl.extra).concat(pl.unmapped));
    return pl;
  },

  /* ---------- 描画 ---------- */
  renderAll(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = t(el.dataset.t));
    $('shopLink').href = shopUrl();
    $('shareFoot').innerHTML = `<span>Share</span>${shareHtml(t('shareText'))}`;
    this.renderSource(); this.renderTarget(); this.renderPreview(); this.renderBar();
  },
  setStatus(s){ $('status').textContent = s; },

  renderSource(){
    const n = this.fonts.length, files = this.fonts.reduce((a, f) => a + f.files.length, 0);
    $('srcInfo').innerHTML = n ? `<span class="mono badge">${esc(t('loaded', {fonts: n, files}))}</span>${this.ignored ? ` <small>${esc(t('ignored', {n: this.ignored}))}</small>` : ''} <button class="btn tiny" id="btnClear">${t('clear')}</button>` : '';
    const c = $('btnClear'); if (c) c.onclick = () => { this.entries = []; this.fonts = []; this.ignored = 0; this.last = null; this.renderAll(); };
    $('drop').classList.toggle('has', n > 0);
  },

  renderTarget(){
    $('tgts').innerHTML = SSC.TARGETS.map(id => {
      const F = SSC.FORMATS[id];
      return `<button class="tgt${id === this.target ? ' on' : ''}" data-tgt="${id}" aria-pressed="${id === this.target}"><b>${F.label}</b><span>${esc(F.full)}</span><code class="mono">${esc(t('tgtEx')[id])}</code></button>`;
    }).join('');
    $('tgts').querySelectorAll('[data-tgt]').forEach(b => b.onclick = () => {
      const prev = this.target; this.target = b.dataset.tgt; store.set('target', this.target);
      // 「変換先と同じ形式なので外す」を付け直す
      for (const f of this.fonts) { if (f.fmt === this.target) f.include = false; else if (f.fmt === prev && !f.tracksOnly) f.include = true; }
      this.last = null; this.renderTarget(); this.renderOpts(); this.renderPreview(); this.renderBar();
    });
    this.renderOpts();
  },
  renderOpts(){
    const o = this.opts, tg = this.target;
    $('opts').innerHTML = `
      ${tg === 'proffie' ? `<label class="inl">${t('optDigits')} <select id="oDigits">${[1, 2, 3].map(d => `<option value="${d}"${o.digits === d ? ' selected' : ''}>${['1, 2, 3', '01, 02, 03', '001, 002, 003'][d - 1]}</option>`).join('')}</select></label>
      <label class="chk"><input type="checkbox" id="oIni"${o.addIni ? ' checked' : ''}>${t('optIni')}</label>` : ''}
      ${tg === 'cfx' ? `<label class="chk"><input type="checkbox" id="oMelt"${o.meltToDrag ? ' checked' : ''}>${t('optMelt')}</label>` : ''}
      ${tg === 'xeno3' ? `<small>—</small>` : ''}`;
    const save = () => { store.set('opts', {digits: o.digits, addIni: o.addIni, meltToDrag: o.meltToDrag}); this.last = null; this.renderPreview(); this.renderBar(); };
    if ($('oDigits')) $('oDigits').onchange = e => { o.digits = +e.target.value; save(); };
    if ($('oIni')) $('oIni').onchange = e => { o.addIni = e.target.checked; save(); };
    if ($('oMelt')) $('oMelt').onchange = e => { o.meltToDrag = e.target.checked; save(); };
  },

  /** 一覧を短く：1つなら名前、複数なら「最初 … 最後」 */
  span(list){
    if (!list.length) return '';
    const n = s => esc(s.replace(/\.wav$/i, ''));
    return list.length === 1 ? n(list[0]) : `${n(list[0])}<i>〜</i>${n(list[list.length - 1])}`;
  },

  renderPreview(){
    const el = $('preview');
    if (!this.fonts.length) { el.innerHTML = `<p class="hint empty">${t('noFonts')}</p>`; return; }
    const tgtLabel = SSC.label(this.target);
    el.innerHTML = this.fonts.map((f, fi) => {
      const pl = this.planFor(f);
      const wavItems = pl.items.filter(i => SSC.isWav(i.out));
      // 種類ごとにまとめる
      const groups = new Map();
      for (const it of pl.items) { if (!groups.has(it.type)) groups.set(it.type, []); groups.get(it.type).push(it); }
      const rows = [...groups].map(([type, its]) => {
        const unv = its.some(i => i.note === 'unverified');
        return `<tr${unv ? ' class="unv"' : ''}><td class="mono ty">${esc(type)}${unv ? ` <span class="warnmark" title="${esc(t('unverifiedTip'))}">⚠</span>` : ''}</td>
          <td class="mono">${this.span(its.map(i => i.src.rel))}</td><td class="arr">→</td><td class="mono to">${this.span(its.map(i => i.out))}</td><td><span class="badge">${its.length}</span></td></tr>`;
      }).join('');
      const extra = pl.extra.map(x => `<tr class="add"><td class="mono ty">+</td><td></td><td class="arr">→</td><td class="mono to">${esc(x.out)}</td><td></td></tr>`).join('');
      const warns = pl.warnings.map(w => t(w.key, w.args));
      if (f.wavBad && f.wavBad.length) warns.push(t('wFormat', {n: f.wavBad.length, f: f.wavBad[0].rel, fmt: f.wavBad[0].fmt}));
      if (f.fmt === this.target) warns.unshift(t('same'));
      if (f.tracksOnly) warns.unshift(t('wTracksOnly'));
      const fmtSel = Object.values(SSC.FORMATS).map(F => `<option value="${F.id}"${F.id === f.fmt ? ' selected' : ''}>${F.label}${F.inputOnly ? ' *' : ''}</option>`).join('');
      const all = pl.items.concat(pl.extra.map(x => ({out: x.out, src: {rel: '(new)'}}))).map(i => `${i.src.rel}  →  ${i.out}`).join('\n');
      const un = pl.unmapped.map(u => `<li><span class="mono">${esc(u.src.rel)}</span> <small>— ${esc(t('why')[u.why] || u.why)}</small></li>`).join('');
      return `<section class="font${f.include ? '' : ' off'}" data-fi="${fi}">
        <div class="font-h">
          <label class="chk"><input type="checkbox" data-inc="${fi}"${f.include ? ' checked' : ''}><span class="sr">${t('include')}</span></label>
          <b class="fname">${esc(f.name)}</b><small class="mono froot">${esc(f.root || '/')}</small>
          <span class="hsp"></span>
          <label class="mono fsel"><span>${t('detected')}</span><select data-fmt="${fi}" aria-label="${t('detected')}">${fmtSel}</select></label>
          <span class="mono farrow">→ <b>${tgtLabel}</b></span>
        </div>
        <div class="fstats mono"><span>${f.files.length} ${t('files')}</span><span class="ok">${wavItems.length} ${t('converted')}</span>${pl.unmapped.length ? `<span class="wn">${pl.unmapped.length} ${t('unmapped')}</span>` : ''}${SSC.FORMATS[f.fmt].inputOnly ? `<span>* ${t('inputOnly')}</span>` : ''}</div>
        ${warns.length ? `<ul class="warns">${warns.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
        <div class="tw"><table class="map"><thead><tr><th>${t('colType')}</th><th>${t('colFrom')}</th><th></th><th>${t('colTo')} (${tgtLabel})</th><th></th></tr></thead><tbody>${rows}${extra}</tbody></table></div>
        ${un ? `<details class="unm"><summary>${t('unmappedT')}（${pl.unmapped.length}）</summary><ul>${un}</ul></details>` : ''}
        <details class="all"><summary>${t('showAll')}</summary><pre class="log">${esc(all)}</pre></details>
      </section>`;
    }).join('');
    el.querySelectorAll('[data-inc]').forEach(c => c.onchange = () => { this.fonts[+c.dataset.inc].include = c.checked; this.last = null; this.renderPreview(); this.renderBar(); });
    el.querySelectorAll('[data-fmt]').forEach(s => s.onchange = async () => {
      const f = this.fonts[+s.dataset.fmt]; f.fmt = s.value; this.last = null;
      this.renderPreview(); this.renderBar(); await this.checkDupes();
    });
  },

  selected(){ return this.fonts.filter(f => f.include); },
  renderBar(){
    const sel = this.selected();
    const files = sel.reduce((a, f) => { const pl = this.planFor(f); return a + pl.items.length + pl.extra.length + pl.unmapped.length; }, 0);
    $('sumBar').textContent = sel.length ? t('sumBar', {fonts: sel.length, files, tgt: SSC.label(this.target)}) : (this.fonts.length ? t('nothing') : '');
    $('btnConvert').disabled = !sel.length || this.busy;
    const r = $('result');
    if (this.last) {
      r.hidden = false;
      r.innerHTML = `<div class="done-h"><b class="disp">${t('done')}</b><span>${esc(t('doneSub', {name: this.last.name, size: fmtSize(this.last.blob.size)}))}</span>
        <button class="btn small" id="btnAgain">${t('again')}</button></div>
        <details><summary>${t('logT')}</summary><pre class="log">${esc(this.last.log)}</pre></details>`;
      $('btnAgain').onclick = () => download(this.last.name, this.last.blob);
    } else r.hidden = true;
  },

  /* ---------- 変換 ---------- */
  async convert(){
    const sel = this.selected(); if (!sel.length || this.busy) return;
    this.busy = true; document.body.classList.add('is-busy'); this.renderBar();
    const tg = this.target, T = SSC.label(tg);
    const jobs = [];
    const log = [`Saber Sound Converter ${APP_VER}`, `${fmtDate()}  →  ${T}`, `Options: ${JSON.stringify({digits: this.opts.digits, addIni: this.opts.addIni, meltToDrag: this.opts.meltToDrag})}`, ''];
    const used = new Set();
    for (const f of sel) {
      const pl = this.planFor(f);
      let dir = f.name.replace(/[<>:"|?*\\/]/g, '_') || 'font', k = 2;
      while (used.has(dir.toLowerCase())) dir = `${f.name}_${k++}`;
      used.add(dir.toLowerCase());
      log.push(`==== ${f.name}  (${f.root || '/'})  ${SSC.label(f.fmt)} → ${T}`);
      for (const w of pl.warnings) log.push(`! ${t(w.key, w.args)}`);
      if (f.wavBad && f.wavBad.length) { log.push(`! ${t('wFormat', {n: f.wavBad.length, f: f.wavBad[0].rel, fmt: f.wavBad[0].fmt})}`); for (const b of f.wavBad) log.push(`    ${b.rel}  ${b.fmt}`); }
      for (const it of pl.items) { jobs.push({path: `${dir}/${it.out}`, src: it.src}); log.push(`  ${it.src.rel}  →  ${it.out}${it.note === 'unverified' ? '   [unverified]' : it.note === 'copy' ? '   [copy]' : ''}`); }
      for (const x of pl.extra) { jobs.push({path: `${dir}/${x.out}`, text: x.text}); log.push(`  (new)  →  ${x.out}`); }
      for (const u of pl.unmapped) { jobs.push({path: `${dir}/${u.out}`, src: u.src}); log.push(`  ${u.src.rel}  →  ${u.out}   [${t('why')[u.why] || u.why}]`); }
      log.push('');
    }
    const logText = log.join('\r\n');
    this.busyShow(true);
    try {
      const zw = Zip.writer(), enc = new TextEncoder();
      for (let i = 0; i < jobs.length; i++) {
        const j = jobs[i];
        this.busyStep(i, jobs.length, j.path);
        zw.add(j.path, j.text != null ? enc.encode(j.text) : await j.src.entry.read());
        if (i % 8 === 7) await new Promise(r => setTimeout(r));
      }
      zw.add('conversion_log.txt', enc.encode('﻿' + logText));
      this.busyStep(jobs.length, jobs.length, '');
      const blob = zw.finish();
      const name = sel.length === 1 ? `${sel[0].name}_${T}.zip` : `SoundFonts_${T}_${stamp()}.zip`;
      this.last = {name, blob, log: logText};
      download(name, blob);
    } catch (err) {
      console.error(err);
      const m = String(err && err.message);
      showDialog(t('error'), m === 'ZIP_TOO_BIG' ? t('errBig') : m === 'ZIP_ENC' ? t('errEnc') : m);
    } finally {
      await new Promise(r => setTimeout(r, 350));
      this.busyShow(false);
      this.busy = false; document.body.classList.remove('is-busy');
      this.renderBar();
    }
  },
  busyShow(on){ const b = $('busy'); b.classList.toggle('on', on); if (on) this.busyStep(0, 1, ''); },
  busyStep(i, n, path){
    const p = Math.floor(i / Math.max(1, n) * 100);
    $('busyFill').style.width = p + '%'; $('busyPct').textContent = p;
    $('busyStep').textContent = `${t('busy')} ${t('busyRead', {i, n})}`;
    $('busySub').textContent = path;
  },

  openMail(){
    const ua = navigator.userAgentData;
    const browser = ua && ua.brands ? ua.brands.filter(x => !/Not/.test(x.brand)).map(x => `${x.brand} ${x.version}`).join(', ') + ` / ${ua.platform}` : navigator.userAgent;
    const info = ['', '', '----', `Saber Sound Converter ${APP_VER}`, `Browser: ${browser}`, `Language: ${lang}`];
    location.href = `mailto:${SHOP.mail.join('@')}?subject=${encodeURIComponent(t('mailSubject'))}&body=${encodeURIComponent(t('mailBody') + info.join('\n'))}`;
  }
};

App.init();
</script>
